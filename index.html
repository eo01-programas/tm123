<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Auditoria Movil</title>
    <link rel="stylesheet" href="css/auditoria-mobile.css">
</head>
<body>
    <main class="mobile-shell">
        <section class="mobile-card">
            <form id="auditoria-mobile-search-form" class="stack-gap" autocomplete="off">
                <label class="field-label" for="auditoria-mobile-search">OP-PTDA</label>
                <div class="search-row">
                    <input
                        id="auditoria-mobile-search"
                        class="mobile-input"
                        type="tel"
                        inputmode="tel"
                        maxlength="18">
                    <button type="submit" class="primary-button">Buscar</button>
                </div>
            </form>
            <p class="status-line" id="auditoria-mobile-sync-status">Cargando datos...</p>
        </section>

        <section class="mobile-card">
            <div class="section-head">
                <div>
                    <h2>Resultados</h2>
                    <p class="section-copy" id="auditoria-mobile-result-summary">Ingresa una OP-PTDA para comenzar.</p>
                </div>
                <button type="button" id="auditoria-mobile-select-all" class="ghost-button section-action-button hidden">Seleccionar todo</button>
            </div>
            <div id="auditoria-mobile-results" class="result-list">
                <div class="empty-state">Ingresa una OP-PTDA para ver coincidencias exactas.</div>
            </div>
        </section>

        <section class="mobile-card hidden" id="auditoria-mobile-form-card">
            <div class="section-head section-head-form">
                <h2>Registro</h2>
                <label class="inline-field-group inline-field-group-turno" for="auditoria-mobile-turno">
                    <span class="field-label">Turno</span>
                    <input id="auditoria-mobile-turno" class="mobile-input inline-turno-input" type="text" readonly>
                </label>
            </div>
            <p class="section-copy" id="auditoria-mobile-selection-summary"></p>

            <div class="form-grid">
                <label class="field-group">
                    <span class="field-label">Auditor</span>
                    <input
                        id="auditoria-mobile-auditor"
                        class="mobile-input"
                        type="text"
                        placeholder="Nombre del audior"
                        autocomplete="name">
                </label>
            </div>

            <button type="button" id="auditoria-mobile-save" class="primary-button primary-button-wide">Guardar Auditoria</button>
        </section>
    </main>

    <a
        id="auditoria-mobile-supervisor-fab"
        class="supervisor-fab"
        href="supervisor-mobile.html"
        aria-label="Supervisor"
        title="Supervisor">
        <span class="supervisor-fab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 2.25 4.5 5.4v5.16c0 4.75 2.97 9.2 7.5 11.19 4.53-1.99 7.5-6.44 7.5-11.19V5.4L12 2.25Zm0 5.25a2.63 2.63 0 1 1 0 5.25 2.63 2.63 0 0 1 0-5.25Zm0 10.87a8.45 8.45 0 0 1-4.62-3.7c.56-1.17 2.3-1.92 4.62-1.92s4.06.75 4.62 1.92A8.45 8.45 0 0 1 12 18.37Z"></path>
            </svg>
        </span>
    </a>

    <div id="auditoria-mobile-toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auditoria-mobile.js"></script>
</body>
</html>
