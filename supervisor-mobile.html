<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Supervisor Movil</title>
    <link rel="stylesheet" href="css/auditoria-mobile.css">
</head>
<body>
    <main class="mobile-shell">
        <section class="mobile-card">
            <form id="supervisor-mobile-search-form" class="stack-gap" autocomplete="off">
                <label class="field-label" for="supervisor-mobile-search">OP-PTDA</label>
                <div class="search-row">
                    <input
                        id="supervisor-mobile-search"
                        class="mobile-input"
                        type="tel"
                        inputmode="tel"
                        maxlength="18">
                    <button type="submit" class="primary-button supervisor-search-button">Buscar</button>
                </div>
            </form>
            <p class="status-line" id="supervisor-mobile-sync-status">Cargando datos...</p>
        </section>

        <section class="mobile-card">
            <div class="section-head">
                <div>
                    <h2>Resultados</h2>
                    <p class="section-copy" id="supervisor-mobile-result-summary">Ingresa una OP-PTDA para comenzar.</p>
                </div>
            </div>
            <div id="supervisor-mobile-results" class="result-list">
                <div class="empty-state">Ingresa una OP-PTDA para ver coincidencias exactas.</div>
            </div>
            <div id="supervisor-mobile-actions" class="mobile-action-row hidden">
                <button type="button" class="mobile-decision-button mobile-decision-button-approve" id="supervisor-mobile-approve-btn">
                    <span class="mobile-decision-icon" aria-hidden="true">&#10003;</span>
                    <span>APROBAR</span>
                </button>
                <button type="button" class="mobile-decision-button mobile-decision-button-reject" id="supervisor-mobile-reject-btn">
                    <span class="mobile-decision-icon" aria-hidden="true">&#10005;</span>
                    <span>RECHAZAR</span>
                </button>
            </div>
        </section>
    </main>

    <div class="mobile-modal-backdrop hidden" id="supervisor-mobile-reject-modal">
        <div class="mobile-modal-card">
            <div class="mobile-modal-head">
                <div>
                    <h3 id="supervisor-mobile-reject-title">Rechazar partidas seleccionadas</h3>
                    <p class="mobile-modal-subtitle" id="supervisor-mobile-reject-subtitle">Completa la informacion del rechazo.</p>
                </div>
                <button class="mobile-modal-close" id="supervisor-mobile-reject-close" type="button" aria-label="Cerrar">x</button>
            </div>

            <form class="mobile-form-grid" id="supervisor-mobile-reject-form" autocomplete="off">
                <div class="field-group">
                    <label class="field-label" for="supervisor-mobile-motivo-rechazo">Motivo de Rechazo</label>
                    <input
                        class="mobile-input"
                        id="supervisor-mobile-motivo-rechazo"
                        name="motivo_rechazo_1"
                        list="supervisor-mobile-motivo-rechazo-list"
                        placeholder="Escribe para buscar motivo...">
                    <datalist id="supervisor-mobile-motivo-rechazo-list"></datalist>
                </div>
                <div class="field-group">
                    <label class="field-label" for="supervisor-mobile-supervisor-rechazo">Supervisor</label>
                    <input
                        type="text"
                        class="mobile-input"
                        id="supervisor-mobile-supervisor-rechazo"
                        name="supervisor_rechazo_1"
                        placeholder="Nombre del Supervisor">
                </div>
                <div class="field-group">
                    <label class="field-label" for="supervisor-mobile-observacion-rechazo">Observacion de Calidad</label>
                    <textarea
                        class="mobile-textarea"
                        id="supervisor-mobile-observacion-rechazo"
                        name="observacion_calidad"
                        rows="4"
                        placeholder="Detalle adicional del rechazo"></textarea>
                </div>
            </form>

            <div class="mobile-modal-actions">
                <button class="ghost-button" id="supervisor-mobile-reject-clear" type="button">Limpiar</button>
                <button class="primary-button mobile-danger-button" id="supervisor-mobile-reject-save" type="button">Guardar y Rechazar</button>
            </div>
        </div>
    </div>

    <div class="mobile-modal-backdrop hidden" id="supervisor-mobile-approve-modal">
        <div class="mobile-modal-card">
            <div class="mobile-modal-head">
                <div>
                    <h3 id="supervisor-mobile-approve-title">Aprobar partidas seleccionadas</h3>
                    <p class="mobile-modal-subtitle" id="supervisor-mobile-approve-subtitle">Completa la informacion de aprobacion.</p>
                </div>
                <button class="mobile-modal-close" id="supervisor-mobile-approve-close" type="button" aria-label="Cerrar">x</button>
            </div>

            <form class="mobile-form-grid" id="supervisor-mobile-approve-form" autocomplete="off">
                <div class="field-group">
                    <label class="field-label" for="supervisor-mobile-tipo-aprobacion">Tipo de Aprobacion</label>
                    <select class="mobile-select" id="supervisor-mobile-tipo-aprobacion" name="tipo_aprobacion">
                        <option value="">Seleccionar tipo...</option>
                    </select>
                </div>
                <div class="field-group">
                    <label class="field-label" for="supervisor-mobile-quien-aprobo">Quien Aprobo</label>
                    <select class="mobile-select" id="supervisor-mobile-quien-aprobo" name="quien_aprobo">
                        <option value="">Seleccionar quien...</option>
                    </select>
                </div>
                <div class="field-group">
                    <label class="field-label" for="supervisor-mobile-supervisor-aprobacion">Supervisor</label>
                    <input
                        type="text"
                        class="mobile-input"
                        id="supervisor-mobile-supervisor-aprobacion"
                        name="supervisor_aprobacion"
                        placeholder="Nombre del Supervisor">
                </div>
                <div class="field-group">
                    <label class="field-label" for="supervisor-mobile-observacion-aprobacion">Observacion de Calidad</label>
                    <textarea
                        class="mobile-textarea"
                        id="supervisor-mobile-observacion-aprobacion"
                        name="observacion_calidad"
                        rows="4"
                        placeholder="Detalle adicional de la aprobacion"></textarea>
                </div>
            </form>

            <div class="mobile-modal-actions">
                <button class="ghost-button" id="supervisor-mobile-approve-clear" type="button">Limpiar</button>
                <button class="primary-button mobile-success-button" id="supervisor-mobile-approve-save" type="button">Aprobar</button>
            </div>
        </div>
    </div>

    <div id="supervisor-mobile-toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/supervisor-mobile.js"></script>
</body>
</html>
